<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mal Agüero</title>
<meta name="description" content="Juego de cartas de leyendas de terror argentinas: lanzá un espanto y adiviná qué remedio lo frena.">
<meta name="theme-color" content="#130f0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mal Agüero">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: mesa de rancho en perspectiva vista desde tu silla; rival arriba, tu mano en abanico abajo, acciones al pie. Mundo único nocturno (decisión). */
:root{
  --noche:#130f0d; --tinta:#1f1916; --hueso:#ebe1cd; --ceniza:#a39686;
  --sangre:#b5352b; --sangre-osc:#5e1a15; --brasa:#e39a43; --linea:#3a302a;
  --madera:#2a1c13; --madera-osc:#140d09; --error:#e0675c;
  --f-display:"Old Standard TT","Iowan Old Style",Georgia,serif;
  --f-texto:"Old Standard TT",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{background:var(--noche);color:var(--hueso)}
body{font-family:var(--f-texto);font-size:16.5px;line-height:1.55;padding-inline:16px;padding-block:0;-webkit-tap-highlight-color:transparent}
html.en-juego,html.en-juego body,html.en-juego #app{height:100%;overflow:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(44px,13vw,64px);line-height:.95}
h2{font-size:28px;line-height:1.1}
h3{font-size:20px;line-height:1.1}
p{margin:0}
.sub{color:var(--ceniza)}
.etq{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ceniza)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--brasa);outline-offset:3px}
.btn{border:1px solid var(--hueso);background:transparent;color:var(--hueso);padding:11px 14px;border-radius:3px;font-family:var(--f-display);font-size:18px;letter-spacing:.02em;line-height:1.1;font-weight:700}
.btn.prim{background:var(--brasa);border-color:var(--brasa);color:var(--noche)}
.btn.rojo{background:var(--sangre);border-color:var(--sangre);color:var(--hueso)}
.btn:disabled{opacity:.3;cursor:default}
.vinc{background:none;border:0;color:var(--ceniza);text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-size:16px}
.fila{display:flex;gap:10px;flex-wrap:wrap}
.fila > *{flex:1 1 140px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ceniza)}
input{background:var(--tinta);border:1px solid var(--linea);color:var(--hueso);padding:12px;font:inherit;border-radius:3px}

/* ---------- Cartas ---------- */
.carta{position:relative;display:block;aspect-ratio:5/7;padding:0;margin:0;border-radius:7%/5%;overflow:hidden;background:#000;border:2px solid var(--sangre);container-type:inline-size;box-shadow:0 6px 14px rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;text-align:left;appearance:none}
.carta.r{border-color:var(--hueso)}
.carta .arte{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.carta .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:48cqw;color:var(--hueso);background:var(--sangre);font-weight:700}
.carta.r .ini{background:var(--hueso);color:var(--noche)}
.carta .nom{position:absolute;left:0;right:0;bottom:0;padding:22cqw 6cqw 5cqw;background:linear-gradient(transparent,rgba(0,0,0,.92));font-family:var(--f-display);font-size:11.5cqw;line-height:1.05;color:var(--hueso);font-weight:700}
.carta .pod{position:absolute;top:5cqw;right:5cqw;width:21cqw;height:21cqw;border-radius:50%;background:var(--sangre);color:var(--hueso);display:grid;place-items:center;font-weight:800;font-size:12.5cqw;font-variant-numeric:tabular-nums;box-shadow:0 0 0 1.5cqw rgba(0,0,0,.45)}
.carta .tipo{position:absolute;top:5cqw;left:5cqw;font-size:7.5cqw;letter-spacing:.12em;text-transform:uppercase;background:var(--hueso);color:var(--noche);padding:1.5cqw 4cqw;border-radius:2px;font-weight:600}
.dorso{aspect-ratio:5/7;border-radius:7%/5%;border:2px solid var(--hueso);
  background:radial-gradient(circle at 58% 44%,var(--sangre-osc) 0 16%,transparent 17%),radial-gradient(circle at 50% 50%,var(--hueso) 0 19%,transparent 20%),repeating-linear-gradient(45deg,rgba(0,0,0,.28) 0 2px,transparent 2px 6px),var(--sangre);
  box-shadow:inset 0 0 0 3px var(--sangre-osc),0 4px 10px rgba(0,0,0,.5)}
.dorso.mini{width:18px;border-width:1px;box-shadow:0 2px 4px rgba(0,0,0,.5)}

/* ---------- Páginas ---------- */
.pagina{max-width:520px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.heroe{position:relative;height:196px}
.heroe .h{position:absolute;left:50%;top:12px;width:108px;margin-left:-54px}
.heroe .h0{transform:translateX(-76px) translateY(18px) rotate(-13deg)}
.heroe .h1{z-index:2}
.heroe .h2{transform:translateX(76px) translateY(18px) rotate(13deg)}
.heroe .carta{animation:flota 5s ease-in-out infinite alternate}
.heroe .h1 .carta{animation-delay:-1.6s}
.heroe .h2 .carta{animation-delay:-3.2s}
@keyframes flota{to{transform:translateY(-9px)}}
.cabecera{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--noche);padding-block:10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--linea)}
.lista{display:flex;flex-direction:column;gap:14px}
.ficha{display:grid;grid-template-columns:72px 1fr;gap:12px;border-bottom:1px solid var(--linea);padding-bottom:14px}
.ficha .carta .nom{display:none}
.ficha > div{min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;padding:2px 7px;border-radius:2px;font-style:normal}
.chip.ch-trad{color:var(--brasa)}
.chip.ch-regla{color:var(--ceniza)}
.reglas ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.aviso{border:1px dashed var(--linea);padding:12px;font-size:15px;color:var(--ceniza)}

/* ---------- Juego ---------- */
.juego{--cw:min(29vw,128px,15.5vh);height:100%;max-width:520px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px;padding-block:6px 8px;position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.iconbtn{width:40px;height:40px;flex:none;border:1px solid var(--linea);background:var(--tinta);color:var(--hueso);border-radius:50%;display:grid;place-items:center;padding:0}
.marca{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.marca.der{align-items:flex-end}
.marca b{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--ceniza)}
.marca.turno b{color:var(--brasa)}
.velas{display:flex;gap:3px}
.vela{width:6px;height:13px;border-radius:1px;background:var(--brasa);box-shadow:0 -2px 6px rgba(227,154,67,.55)}
.vela.off{background:var(--linea);box-shadow:none}
.vela.apagando{animation:apagar 1.2s .25s ease both}
@keyframes apagar{0%{background:var(--brasa);box-shadow:0 -2px 6px rgba(227,154,67,.55)}25%{background:#fff3d6;transform:scaleY(1.25)}100%{background:var(--linea);box-shadow:none;transform:none}}

.mesa{position:relative;border-radius:22px;overflow:hidden;background:var(--madera-osc);box-shadow:inset 0 0 0 1px var(--linea);transition:box-shadow .2s}
.mesa::before{content:"";position:absolute;inset:-25% -35% 0;background:repeating-linear-gradient(90deg,var(--madera) 0 52px,#1d130c 52px 54px,#2f2017 54px 104px,#1a110b 104px 106px);transform:perspective(420px) rotateX(40deg);transform-origin:50% 100%}
.mesa::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 22% 14%,rgba(227,154,67,.32),transparent 50%),radial-gradient(ellipse at 50% 60%,transparent 35%,rgba(0,0,0,.75) 100%)}
.mesa.apunta{box-shadow:inset 0 0 0 2px var(--brasa),inset 0 0 40px rgba(227,154,67,.25)}
.mesa > *{position:absolute;z-index:1}
.velita{left:22%;top:11%;width:9px;height:30px;border-radius:2px;background:linear-gradient(90deg,#c9bda4,var(--hueso),#b4a78d)}
.velita::before{content:"";position:absolute;left:50%;bottom:100%;width:11px;height:17px;margin-left:-5.5px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 72%,#fff3d6 0 22%,var(--brasa) 45%,transparent 72%);transform-origin:50% 100%;animation:llama 1.4s ease-in-out infinite alternate}
@keyframes llama{0%{transform:scale(1,1) rotate(-3deg)}50%{transform:scale(.88,1.14) rotate(2deg)}100%{transform:scale(1.05,.94) rotate(-1deg)}}
.mazo{left:5%;top:7%;width:calc(var(--cw)*.42)}
.pila{position:relative;aspect-ratio:5/7}
.pila .dorso{position:absolute;inset:0}
.pila .dorso:nth-child(2){transform:translate(2px,-2px)}
.pila .dorso:nth-child(3){transform:translate(4px,-4px)}
.cuenta{display:block;text-align:center;font-size:12px;color:var(--ceniza);margin-top:5px;font-variant-numeric:tabular-nums}
.rival{right:10px;top:10px;display:flex;flex-direction:row-reverse;align-items:flex-start;gap:8px}
.avatar{width:46px;height:46px;flex:none;border-radius:50%;background:var(--tinta);border:2px solid var(--linea);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:var(--hueso);transition:border-color .2s,box-shadow .2s;font-weight:700}
.avatar.activo{border-color:var(--brasa);box-shadow:0 0 0 4px rgba(227,154,67,.22)}
.rival-info{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.etiqueta{background:rgba(0,0,0,.6);padding:1px 8px;border-radius:3px;font-size:13px;white-space:nowrap}
.rival-mano{display:flex;min-height:25px}
.rival-mano .dorso + .dorso{margin-left:-9px}
.burbuja{right:12px;top:64px;z-index:4;max-width:min(80%,330px);background:var(--hueso);color:var(--noche);padding:8px 12px;border-radius:12px 2px 12px 12px;font-size:13.5px;line-height:1.35;box-shadow:0 6px 16px rgba(0,0,0,.55);animation:pop .25s ease-out both}
.burbuja b{font-family:var(--f-display);font-weight:700;font-size:16px;display:block}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.slot{top:56%;width:calc(var(--cw)*.86);aspect-ratio:5/7;transform:translateY(-50%);border-radius:8px;z-index:2}
#slotE{left:calc(50% - var(--cw)*.80)}
#slotR{left:calc(50% - var(--cw)*.10);margin-top:16px}
#slotE{--rot:-5deg}
#slotR{--rot:7deg}
.slot.guia{outline:1.5px dashed rgba(235,225,205,.3);outline-offset:-2px}
.slot .carta{width:100%;transform:rotate(var(--rot))}
.carta.vencido{animation:vencido 1s .3s ease forwards}
@keyframes vencido{20%{transform:rotate(var(--rot)) translateX(-6px)}35%{transform:rotate(var(--rot)) translateX(6px)}50%{transform:rotate(var(--rot)) translateX(-3px)}100%{transform:rotate(var(--rot)) translateY(-16px);filter:grayscale(1) brightness(.45);opacity:.55}}
.carta.inutil{animation:inutil .8s .3s ease forwards}
@keyframes inutil{to{transform:rotate(calc(var(--rot) + 16deg)) translateY(20px);filter:grayscale(1) brightness(.45);opacity:.55}}
.carta.triunfa{animation:triunfa 1.1s .3s ease}
@keyframes triunfa{40%{transform:rotate(var(--rot)) scale(1.08);box-shadow:0 0 0 3px var(--sangre),0 0 44px rgba(181,53,43,.9)}}
.sello{left:50%;top:56%;z-index:5;transform:translate(-50%,-50%) rotate(-12deg);font-family:var(--f-display);font-size:clamp(28px,9vw,42px);line-height:1;padding:6px 14px;border:3px solid currentColor;border-radius:6px;background:rgba(19,15,13,.8);white-space:nowrap;pointer-events:none;animation:sello .4s .25s cubic-bezier(.2,1.6,.4,1) both;font-weight:700}
@keyframes sello{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.3);opacity:0}}
.sello.bien{color:var(--brasa)}
.sello.mal{color:var(--error)}
.info{left:10px;right:10px;bottom:10px;z-index:3;background:rgba(19,15,13,.88);border:1px solid var(--linea);border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.35;display:flex;flex-direction:column;gap:3px}
.info p{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.info.pista{background:none;border:0;text-align:center;color:var(--ceniza);font-style:italic}

.mano-zona{position:relative;height:calc(var(--cw)*1.4 + 30px)}
.abanico{position:absolute;inset:0;touch-action:none}
.abanico .carta{position:absolute;left:calc(50% - var(--cw)/2);bottom:24px;width:var(--cw);transform-origin:50% 100%;
  transform:translateX(calc(var(--x,0)*1px)) translateY(calc(var(--y,0)*1px + var(--lift,0px))) rotate(calc(var(--r,0)*1deg));
  transition:transform .22s ease,box-shadow .2s,filter .2s;cursor:grab}
@media (hover:hover){.abanico .carta:hover{--lift:-12px}}
.abanico .carta.sel{--lift:-28px;box-shadow:0 0 0 3px var(--brasa),0 14px 26px rgba(0,0,0,.65)}
.abanico .carta.apagada{filter:brightness(.5) saturate(.6)}
.abanico .carta.entra{animation:entra .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes entra{from{transform:translate(-36vw,-52vh) rotate(-30deg) scale(.4);opacity:0}}
.fantasma{position:fixed;z-index:100;pointer-events:none;margin:0;transition:none;box-shadow:0 20px 40px rgba(0,0,0,.7)}
.vuelo{position:fixed;z-index:100;pointer-events:none;transform-origin:50% 50%}
.vuelo > .carta,.vuelo > .dorso{width:100%;height:100%;aspect-ratio:auto}

.acciones{display:flex;gap:8px}
.acciones .btn{flex:1}
.hoja{position:absolute;left:0;right:0;bottom:0;z-index:20;max-height:64%;overflow:auto;background:var(--tinta);border:1px solid var(--linea);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -14px 30px rgba(0,0,0,.6);animation:sube .4s .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes sube{from{transform:translateY(105%)}}
.veredicto{font-family:var(--f-display);font-size:26px;line-height:1.1;font-weight:700}
.veredicto.bien{color:var(--brasa)}
.veredicto.mal{color:var(--error)}
.hoja .fila .btn{flex:1 1 120px}
.telon{position:absolute;inset:0;z-index:30;background:var(--noche);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center;padding:24px}
.ojo{width:72px;height:36px;border-radius:50%;border:2px solid var(--brasa);position:relative}
.ojo::after{content:"";position:absolute;inset:8px 26px;border-radius:50%;background:var(--brasa)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--cw)*1.4 + 96px);z-index:40;background:var(--hueso);color:var(--noche);padding:8px 14px;border-radius:20px;font-size:14px;line-height:1.3;width:max-content;max-width:88%;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.5)}
/* ---------- Logo ---------- */
.portada-tit{margin:0;line-height:0}
.logo{display:block;width:min(100%,420px);height:auto}
.intro-logo{display:block;width:min(86vw,440px);height:auto}
.btn.chico{font-size:15px;padding:8px 10px}
.iconbtn.apagado{opacity:.5}

/* ---------- Sustos ---------- */
.susto{position:fixed;inset:0;z-index:300;overflow:hidden;background:rgba(0,0,0,0);transition:background .25s;cursor:pointer;-webkit-tap-highlight-color:transparent}
.susto.oscuro{background:rgba(0,0,0,.72)}
.susto.negro{background:rgba(0,0,0,.92);transition:background .5s}
.susto.tenue{background:rgba(0,0,0,.4)}
.susto img{position:fixed;pointer-events:none;max-width:none;will-change:transform,opacity;transform-origin:50% 50%}
.susto svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.susto .cierre{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 #000}
.susto .fig{position:fixed;pointer-events:none;will-change:transform,opacity;transform-origin:50% 50%}
.susto .fig img{position:static;display:block;width:100%;height:auto}
.susto .fig img.ojos{position:absolute;left:0;top:0;width:100%;height:100%;mix-blend-mode:screen;opacity:0}
.susto .destello{position:fixed;width:70vmax;height:70vmax;border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,240,215,.95),rgba(227,154,67,.6) 22%,rgba(181,53,43,.28) 44%,transparent 66%)}
.susto .brasa{position:fixed;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#ffc070;box-shadow:0 0 8px 2px rgba(255,120,30,.9);pointer-events:none}
.susto .humo{position:fixed;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(160,150,140,.45),transparent 70%);pointer-events:none}
.susto .robada{position:fixed;width:6px;height:13px;border-radius:1px;background:var(--brasa);box-shadow:0 -2px 8px rgba(227,154,67,.8)}
.mesa.sin-luz .velita::before{opacity:0;transition:opacity .2s}
.mesa.sin-luz::after{background:radial-gradient(ellipse at 50% 60%,transparent 20%,rgba(0,0,0,.9) 100%)}
.temblor{animation:temblor .45s linear}
@keyframes temblor{10%{transform:translate(-9px,4px) rotate(-1deg)}20%{transform:translate(8px,-6px)}30%{transform:translate(-7px,-3px) rotate(1deg)}40%{transform:translate(6px,5px)}55%{transform:translate(-4px,2px)}70%{transform:translate(3px,-2px)}85%{transform:translate(-1px,1px)}}

/* ---------- Tutorial ---------- */
#coach{position:fixed;inset:0;z-index:250;pointer-events:none}
.coach-hueco{position:fixed;border-radius:14px;box-shadow:0 0 0 200vmax rgba(8,6,5,.74);transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease;pointer-events:none}
.coach-hueco.foco{outline:2px solid var(--brasa);outline-offset:3px;animation:foco 1.6s ease-in-out infinite}
@keyframes foco{50%{outline-offset:8px;outline-color:rgba(227,154,67,.35)}}
.coach-globo{position:fixed;left:16px;right:16px;margin:0 auto;max-width:440px;pointer-events:auto;background:var(--hueso);color:var(--noche);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 34px rgba(0,0,0,.65);transition:top .35s ease}
.coach-quien{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:15px}
.coach-quien .avatar{width:30px;height:30px;font-size:16px;border-width:1px;background:var(--noche);color:var(--hueso)}
.coach-paso{margin-left:auto;font-family:var(--f-texto);font-weight:400;font-size:12px;color:#6b5f52;font-variant-numeric:tabular-nums}
.coach-txt{font-size:15.5px;line-height:1.42}
.coach-pie{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.coach-pie .vinc{color:#6b5f52;font-size:14px}
.coach-pie .btn{padding:9px 16px}
.toast{z-index:270}

/* ---------- Inicio ---------- */
.intro{position:fixed;inset:0;z-index:200;background:var(--noche);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;overflow:hidden;cursor:pointer;animation:introFuera .7s 3.4s ease forwards}
.intro.salir{animation:introFuera .35s ease forwards}
@keyframes introFuera{to{opacity:0;visibility:hidden}}
.intro-luz{position:absolute;left:50%;top:38%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;border-radius:50%;background:radial-gradient(circle,rgba(227,154,67,.28),rgba(181,53,43,.08) 30%,transparent 55%);opacity:0;transform:scale(.2);animation:introLuz 1.6s .5s ease-out forwards;pointer-events:none}
@keyframes introLuz{to{opacity:1;transform:scale(1)}}
.intro-vela{position:relative;width:12px;height:44px;border-radius:2px;background:linear-gradient(90deg,#c9bda4,var(--hueso),#b4a78d);opacity:0;animation:aparece .5s .1s ease forwards}
.intro-vela::before{content:"";position:absolute;left:50%;bottom:100%;width:16px;height:26px;margin-left:-8px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 72%,#fff3d6 0 22%,var(--brasa) 45%,transparent 72%);transform-origin:50% 100%;transform:scale(0);animation:prende .6s .45s ease-out forwards,llama 1.4s 1.05s ease-in-out infinite alternate}
@keyframes prende{to{transform:scale(1)}}
@keyframes aparece{to{opacity:1}}
.intro-tit{position:relative;font-size:clamp(46px,14vw,72px);line-height:.95;opacity:0;letter-spacing:.5em;filter:blur(8px);animation:titulo 1.1s 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes titulo{to{opacity:1;letter-spacing:.01em;filter:blur(0)}}
.intro-sub{position:relative;opacity:0;animation:aparece .6s 1.8s ease forwards}
.intro-cartas{position:relative;display:flex;justify-content:center;height:84px;width:160px;margin-top:6px}
.intro-cartas .dorso{position:absolute;width:56px;left:52px;top:4px;opacity:0;animation:repartir .5s ease forwards}
.intro-cartas .dorso:nth-child(1){--t:translateX(-40px) rotate(-14deg);animation-delay:2.1s}
.intro-cartas .dorso:nth-child(2){--t:translateY(-4px);animation-delay:2.25s}
.intro-cartas .dorso:nth-child(3){--t:translateX(40px) rotate(14deg);animation-delay:2.4s}
@keyframes repartir{from{opacity:0;transform:translateY(60px) scale(.6)}to{opacity:1;transform:var(--t)}}
.intro-saltar{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--ceniza);opacity:0;animation:aparece .5s 1.2s ease forwards}
.instalar{display:flex;align-items:center;gap:12px;border:1px solid var(--linea);background:var(--tinta);border-radius:10px;padding:12px}
.instalar img{width:44px;height:44px;border-radius:10px;flex:none}
.instalar div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.instalar b{font-family:var(--f-display);font-weight:700;font-size:18px}
.instalar .btn{flex:none;padding:9px 12px;font-size:16px}
@media (prefers-reduced-motion:reduce){.intro{animation:introFuera .3s .8s ease forwards!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}

<script>
const ESPANTOS = {

  lobizon:{nombre:"El Lobizón",lugar:"Centro y Litoral · Pampa, Entre Ríos, Corrientes (Luisón)",poder:4,remedio:"bala",fuente:"tradicion",
    texto:"El séptimo hijo varón se transforma en bestia las noches de luna llena, sobre todo los viernes.",

    porque:"Se acostumbra rezar por el ánima que la provoca y no seguirla."},
  viuda:{nombre:"La Viuda",lugar:"Pampa, Litoral y Noroeste",poder:3,remedio:"rezo",fuente:"juego",
    texto:"Mujer alta, vestida de negro, que sale a los caminos de noche y asusta a los jinetes solitarios.",
    porque:"Las versiones sobre cómo ahuyentarla varían. En el juego se la espanta con un rezo."},
  cuero:{nombre:"El Cuero",lugar:"Patagonia · lagos de Neuquén y Río Negro",poder:4,remedio:"calafate",fuente:"tradicion",
    texto:"Parece un cuero de vaca tendido en la orilla. Cuando alguien se acerca, se enrolla y lo arrastra al fondo del lago.",
    porque:"Según la tradición mapuche, se lo vence arrojándole ramas espinosas de calafate: al apretarlas se lastima."},
  ucumar:{nombre:"El Ucumar",lugar:"Noroeste · yungas de Salta y Tucumán",poder:3,remedio:"fuego",fuente:"juego",
    texto:"Mitad hombre y mitad oso. Enorme y peludo, aparece de improviso en el monte de las yungas.",

  uturunco:{nombre:"El Runa Uturunco",lugar:"Noroeste y Chaco",poder:4,remedio:"fuego",fuente:"juego",
    texto:"Hombre que se transforma en yaguareté para cazar ganado y personas en el monte.",
    porque:"La tradición no le fija un remedio; en el juego se lo ahuyenta con fuego."}
};
const REMEDIOS = {
  rezo:{nombre:"Rezo por las ánimas",texto:"Calma a las almas en pena.",copias:5},
  punal:{nombre:"Puñal",texto:"Su cabo forma una cruz. También sirve para hacer tajos en cruz.",copias:4},
  tabaco:{nombre:"Tabaco y caña",texto:"Ofrenda para los duendes del monte.",copias:4},
  bala:{nombre:"Bala bendecida",texto:"Hiere a lo que ninguna bala común toca.",copias:2},
  calafate:{nombre:"Ramas de calafate",texto:"Arbusto espinoso de la Patagonia.",copias:2},
  fuego:{nombre:"Tizón del fogón",texto:"Ahuyenta a las bestias del monte.",copias:3},
  rosario:{nombre:"Rosario",texto:"Sirve contra cualquier espanto, pero frena solo la mitad del susto.",copias:3}
};
const CORAJE = 8, MANO = 5, MANO_MAX = 7;
const BOT = "Don Ceferino", BOT_ACIERTO = 0.75;
const ARTE = new Set([...Object.keys(ESPANTOS), ...Object.keys(REMEDIOS)]);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ICON_ATRAS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
const ICON_LIBRO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>';
const DORSO = '<div class="dorso"></div>';

let S = null, uidSeq = 1, ocupado = false, botCorriendo = false, drag = null, toastT = null;

const PREF = (()=>{ const p={sonido:true,sustos:true}; try{ Object.assign(p, JSON.parse(localStorage.getItem("ma-pref")||"{}")); }catch(_){} return p; })();
function guardarPref(){ try{ localStorage.setItem("ma-pref", JSON.stringify(PREF)); }catch(_){} }
const ICON_SON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_MUDO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';

/* ---------- sonido generado por código ---------- */
const Sonido = (()=>{
  let ctx=null, master=null, ruidoBuf=null, amb=null, cargando=null;
  const bufs={};
  const ARCHIVOS=["ambiente","baba","caballo","fantasma","grito","hombre","luz","monstruo","oso","perro","rebuzno","silbido"];
  /* id del espanto -> [muestra, velocidad, volumen, duración máxima] */
  const VOCES={lobizon:["monstruo",1,1,3.2],uturunco:["monstruo",1.22,1,2.6],ucumar:["oso",1,1,2.8],familiar:["perro",1,1,2.9],
    mulanima:["rebuzno",1,1,3.4],cuero:["baba",1,1.1,3],viuda:["grito",1,1,1.5],pombero:["silbido",.82,.9,2.2],yasi:["silbido",1.08,.9,2.6],
    futre:["caballo",1,1,3.2],enancada:["fantasma",1.12,1,2.6],animas:["fantasma",.88,1,2.7],luzmala:["luz",1,.9,3.6]};
  const SINTE={lobizon:()=>SON.grunido(.9,70),uturunco:()=>SON.grunido(.8,95),ucumar:()=>SON.grunido(1,58),familiar:()=>{SON.grunido(.9,80);SON.cadenas();},
    mulanima:()=>SON.rebuzno(),cuero:()=>{SON.agua();SON.grunido(1,46);},viuda:()=>SON.lamento(),pombero:()=>SON.silbido(),yasi:()=>SON.yasi(),
    futre:()=>SON.susurro(),enancada:()=>SON.susurro(),animas:()=>SON.susurro(),luzmala:()=>SON.susurro()};
  function cargarMuestras(){
    if(cargando || !ctx) return;
    cargando=Promise.all(ARCHIVOS.map(k=>fetch(`sonidos/${k}.mp3`).then(r=>r.ok?r.arrayBuffer():Promise.reject(r.status))
      .then(ab=>new Promise((res,rej)=>ctx.decodeAudioData(ab,res,rej))).then(b=>{ bufs[k]=b; }).catch(()=>{})))
      .then(()=>{ if(amb && amb.sinte && bufs.ambiente){ ambienteOff(); setTimeout(ambienteOn,900); } });
  }
  function muestra(k,{vol=1,rate=1,dur=null}={}){
    const b=bufs[k]; if(!b || !listo()) return false;
    const t=ctx.currentTime, src=ctx.createBufferSource(); src.buffer=b; src.playbackRate.value=rate;
    const g=ctx.createGain(); g.gain.setValueAtTime(vol,t); src.connect(g).connect(master);
    if(dur && dur*rate<b.duration){ g.gain.setValueAtTime(vol,t+Math.max(0,dur-.35)); g.gain.linearRampToValueAtTime(.0001,t+dur); src.start(t,0,dur*rate+.05); }
    else src.start(t);
    return true;
  }
  function iniciar(){
    if(ctx){ if(ctx.state==="suspended") ctx.resume().catch(()=>{}); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=PREF.sonido?.9:0; master.connect(ctx.destination);
    const len=ctx.sampleRate*2; ruidoBuf=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=ruidoBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    cargarMuestras();
  }
  const listo=()=>ctx && PREF.sonido && ctx.state!=="closed";
  function env(g,t,a,pico,dec){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(pico,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+dec); }
  function ruido(t,dur,{tipo="bandpass",f=1000,f2=null,q=1,pico=.5,a=.005,dest=master}={}){
    const s=ctx.createBufferSource(); s.buffer=ruidoBuf; s.loop=true;
    const fl=ctx.createBiquadFilter(); fl.type=tipo; fl.frequency.setValueAtTime(f,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+dur); fl.Q.value=q;
    const g=ctx.createGain(); env(g,t,a,pico,dur); s.connect(fl).connect(g).connect(dest);
    s.start(t,Math.random()); s.stop(t+a+dur+.05);
  }
  function tono(t,dur,{tipo="sine",f=440,f2=null,pico=.3,a=.005,filtro=null,dest=master}={}){
    const o=ctx.createOscillator(); o.type=tipo; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    const g=ctx.createGain(); env(g,t,a,pico,dur); let n=o;
    if(filtro){ const fl=ctx.createBiquadFilter(); fl.type="lowpass"; fl.frequency.value=filtro; o.connect(fl); n=fl; }
    n.connect(g).connect(dest); o.start(t); o.stop(t+a+dur+.05); return o;
  }
  function vibrato(o,t,dur,hz,prof){ const v=ctx.createOscillator(); v.frequency.value=hz; const vg=ctx.createGain(); vg.gain.value=prof; v.connect(vg).connect(o.frequency); v.start(t); v.stop(t+dur+.1); }
  const SON={
    tick(){ const t=ctx.currentTime; ruido(t,.03,{f:3500,q:2,pico:.12}); },
    deslizar(){ const t=ctx.currentTime; ruido(t,.16,{tipo:"highpass",f:2500,f2:5500,pico:.1,a:.04}); },
    carta(){ const t=ctx.currentTime; tono(t,.12,{f:150,f2:60,pico:.45}); ruido(t,.05,{f:2200,q:.8,pico:.3}); },
    repartir(n=5){ const t=ctx.currentTime; for(let i=0;i<n;i++) ruido(t+i*.08,.06,{f:3000,q:1.2,pico:.16}); },
    sello(){ const t=ctx.currentTime; tono(t,.25,{f:110,f2:45,pico:.7}); ruido(t,.12,{tipo:"lowpass",f:900,pico:.45}); },
    vela(i=0){ const t=ctx.currentTime+i*.17; ruido(t,.32,{f:700,f2:280,q:.6,pico:.22,a:.06}); },
    premio(){ const t=ctx.currentTime; [523,659,784].forEach((f,i)=>tono(t+i*.09,.35,{tipo:"triangle",f,pico:.12})); },
    zarpazo(){ const t=ctx.currentTime; for(let i=0;i<3;i++) ruido(t+i*.07,.13,{f:4200,f2:700,q:1.4,pico:.6,a:.004}); },
    grunido(dur=.9,f=72){
      const t=ctx.currentTime, o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.setValueAtTime(f,t); o.frequency.linearRampToValueAtTime(f*.78,t+dur);
      const fl=ctx.createBiquadFilter(); fl.type="lowpass"; fl.frequency.value=520;
      const am=ctx.createGain(); am.gain.value=.5; const lfo=ctx.createOscillator(); lfo.frequency.value=23; const lg=ctx.createGain(); lg.gain.value=.5; lfo.connect(lg).connect(am.gain);
      const g=ctx.createGain(); env(g,t,.08,.85,dur); o.connect(fl).connect(am).connect(g).connect(master);
      o.start(t); lfo.start(t); o.stop(t+dur+.2); lfo.stop(t+dur+.2);
      ruido(t,dur,{tipo:"lowpass",f:420,pico:.22,a:.06});
    },
    cadenas(){ const t=ctx.currentTime; for(let i=0;i<10;i++){ const tt=t+i*.045+Math.random()*.02; tono(tt,.12,{tipo:"triangle",f:2400+Math.random()*2600,pico:.1}); tono(tt,.07,{tipo:"square",f:3800+Math.random()*1500,pico:.035}); } },
    rebuzno(){ const t=ctx.currentTime; for(let k=0;k<2;k++){ const b=t+k*.62; tono(b,.24,{tipo:"sawtooth",f:560,f2:500,pico:.32,a:.03,filtro:1700}); tono(b+.26,.32,{tipo:"sawtooth",f:270,f2:210,pico:.36,a:.03,filtro:1100}); } },
    vidrio(){ const t=ctx.currentTime; tono(t,.32,{f:95,f2:38,pico:.95}); ruido(t,.09,{tipo:"lowpass",f:800,pico:.55}); ruido(t,.4,{tipo:"highpass",f:3200,pico:.42,a:.002}); for(let i=0;i<16;i++){ const tt=t+.01+Math.random()*.45; tono(tt,.08+Math.random()*.16,{f:2400+Math.random()*4800,pico:.05+Math.random()*.06}); } },
    silbido(){ const t=ctx.currentTime; const o=tono(t,.8,{f:1500,f2:2350,pico:.15,a:.06}); vibrato(o,t,.8,7,40); },
    yasi(){ const t=ctx.currentTime; for(let k=0;k<2;k++){ const b=t+k*.75; tono(b,.18,{f:1850,f2:2450,pico:.16}); tono(b+.24,.16,{f:2450,f2:2050,pico:.15}); tono(b+.44,.22,{f:2100,f2:1800,pico:.13}); } },
    hojas(){ const t=ctx.currentTime; for(let i=0;i<7;i++) ruido(t+i*.055,.08,{f:5200,q:.7,pico:.12}); },
    agua(){ const t=ctx.currentTime; ruido(t,1.2,{tipo:"lowpass",f:650,f2:180,pico:.35,a:.12}); for(let i=0;i<12;i++) tono(t+Math.random()*1.1,.05,{f:240+Math.random()*320,f2:520+Math.random()*420,pico:.1}); },
    lamento(){
      const t=ctx.currentTime; ruido(t,.45,{f:300,f2:2600,q:.8,pico:.3,a:.3});
      const t2=t+.45, o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.setValueAtTime(950,t2); o.frequency.exponentialRampToValueAtTime(330,t2+1.1);
      vibrato(o,t2,1.2,6,28);
      const f1=ctx.createBiquadFilter(); f1.type="bandpass"; f1.frequency.value=1150; f1.Q.value=4;
      const g=ctx.createGain(); env(g,t2,.03,.5,1.1); o.connect(f1).connect(g).connect(master); o.start(t2); o.stop(t2+1.3);
      ruido(t2,1.1,{f:2100,q:1,pico:.14});
    },
    susurro(){ const t=ctx.currentTime; for(let i=0;i<5;i++) ruido(t+i*.2,.24,{f:1700+Math.random()*1400,q:3,pico:.1,a:.08}); tono(t,1.2,{f:180,f2:150,pico:.04,a:.3}); }
  };
  function play(n,...a){ try{ iniciar(); if(listo() && SON[n]) SON[n](...a); }catch(_){} }
  function voz(id,{suave=false}={}){
    try{
      iniciar(); if(!listo()) return;
      const v=VOCES[id];
      if(v && muestra(v[0],{rate:v[1],vol:v[2]*(suave?.4:1),dur:suave?Math.min(1.6,v[3]):v[3]})) return;
      if(!suave && SINTE[id]) SINTE[id]();
    }catch(_){}
  }
  function grito(){ try{ iniciar(); if(listo()) muestra("hombre",{vol:.9}); }catch(_){} }
  function ambienteOn(){
    try{
      if(!listo() || amb) return;
      if(bufs.ambiente){
        const t=ctx.currentTime, g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.55,t+2.5); g.connect(master);
        const s=ctx.createBufferSource(); s.buffer=bufs.ambiente; s.loop=true; s.connect(g); s.start();
        amb={g,s,lfo:null,grillo:null,sinte:false}; return;
      }
      const t=ctx.currentTime, g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+2.5); g.connect(master);
      const s=ctx.createBufferSource(); s.buffer=ruidoBuf; s.loop=true;
      const fl=ctx.createBiquadFilter(); fl.type="lowpass"; fl.frequency.value=380;
      const lfo=ctx.createOscillator(); lfo.frequency.value=.07; const lg=ctx.createGain(); lg.gain.value=200; lfo.connect(lg).connect(fl.frequency);
      s.connect(fl).connect(g); s.start(); lfo.start();
      const grillo=setInterval(()=>{ if(!listo()) return; const t=ctx.currentTime; for(let i=0;i<3;i++) tono(t+i*.07,.03,{f:4300,pico:.018}); },2600);
      amb={g,s,lfo,grillo,sinte:true};

  else if(rem.id===e.remedio){ dano=0; tipo="bien"; }

  else tipo="mal";
  const desde=def.coraje; def.coraje=Math.max(0,def.coraje-dano);
  S.dano={p:d,desde,hasta:def.coraje};
  if(tipo==="bien" && def.mano.length<MANO_MAX) robar(d);
  S.res={tipo,dano,esp:S.ataque.id,rem:rem?rem.id:null,def:d};
  S.fase=def.coraje<=0?"fin":"resultado"; S.sel=null;
  if(S.modo==="bot"){
    S.burbuja = esBot(d)
      ? {t:{bien:`Eso se espanta con ${REMEDIOS[e.remedio].nombre.toLowerCase()}, m'hijo.`,mal:"Uh… con esto no era.",rosario:"Con el rosario algo me cubro.",aguanta:"Me lo banco nomás."}[tipo]}
      : {t:{bien:"¡Mirá vos! Sabías.",mal:"Je. Con eso no se va.",rosario:"A medias, nomás.",aguanta:"Te lo comiste entero."}[tipo]};
  } else S.burbuja=null;
  if(debeAsustar()){
    S.sustoPend=true; render(); ocupado=true;
    asustar(S.ataque.id).then(()=>{ ocupado=false; S.sustoPend=false; render(); efectosResultado(); });
  } else { render(); efectosResultado(); }
}
function seguir(){
  if(S.ataque) S.descarte.push(S.ataque);
  if(S.defensa) S.descarte.push(S.defensa);
  S.ataque=S.defensa=null; S.turno=S.res.def; S.res=null; S.dano=null;
  comenzarTurno();
}
function cambiar(uid){
  const a=S.turno, p=S.players[a], i=p.mano.findIndex(c=>c.uid===uid); if(i<0) return;
  S.descarte.push(p.mano.splice(i,1)[0]); robar(a); S.sel=null; S.turno=otro(a);
  if(S.modo==="dos"){ S.fase="ataque"; S.burbuja=null; S.telon={titulo:`Turno de ${S.players[S.turno].nombre}`,texto:`${p.nombre} cambió una carta y pasó. Pasale el celu.`}; render(); }
  else comenzarTurno();
}
function levantarTelon(){
  S.telon=null;
  if(S.fase==="ataque" && !S.ataque) comenzarTurno(); else render();
}

/* ---------- animación de vuelo ---------- */
function rectCentro(el){
  const b=el.getBoundingClientRect(), w=el.offsetWidth, h=el.offsetHeight;
  return {left:b.left+b.width/2-w/2, top:b.top+b.height/2-h/2, width:w, height:h};
}
function volar(html, from, to, o={}){
  return new Promise(res=>{
    const g=document.createElement("div"); g.className="vuelo";
    Object.assign(g.style,{left:from.left+"px",top:from.top+"px",width:from.width+"px",height:from.height+"px"});
    g.innerHTML = o.flip ? DORSO : html;
    document.body.appendChild(g);
    if(!o.mudo) Sonido.play("deslizar");
    const fin=gg=>{ if(!o.mudo) Sonido.play("carta"); res(gg); };
    const dx=(to.left+to.width/2)-(from.left+from.width/2), dy=(to.top+to.height/2)-(from.top+from.height/2), s=to.width/from.width;
    const dur=reduce?1:(o.dur||480), r0=o.rot0||0, r1=o.rot1||0;
    const t0=`translate(0px,0px) rotate(${r0}deg) scale(1,1)`, t1=`translate(${dx}px,${dy}px) rotate(${r1}deg) scale(${s},${s})`;
    if(!o.flip){
      g.animate([{transform:t0},{transform:t1}],{duration:dur,easing:"cubic-bezier(.2,.8,.2,1)",fill:"forwards"}).finished.then(()=>fin(g),()=>fin(g));
    } else {
      const sm=(1+s)/2, tm=`translate(${dx/2}px,${dy/2-30}px) rotate(${(r0+r1)/2}deg) scale(0.02,${sm})`;
      g.animate([{transform:t0},{transform:tm}],{duration:dur/2,easing:"ease-in",fill:"forwards"}).finished
        .then(()=>{ g.innerHTML=html; return g.animate([{transform:tm},{transform:t1}],{duration:dur/2,easing:"ease-out",fill:"forwards"}).finished; })
        .then(()=>fin(g),()=>fin(g));
    }
  });
}
function soltarVuelo(g){ requestAnimationFrame(()=>requestAnimationFrame(()=>g.remove())); }

/* ---------- jugadas del humano ---------- */
function validar(uid){
  const c=S.players[viewer()].mano.find(x=>x.uid===uid); if(!c) return false;
  if(S.tuto){
    const p=PASOS[S.tuto.i];
    if(p && p.btn){ toast(`Primero leé lo que te dice ${BOT}.`); return false; }
    if(p && p.solo && c.id!==p.solo){ toast(`Buscá ${(REMEDIOS[p.solo]||ESPANTOS[p.solo]).nombre}.`); return false; }
  }
  if(S.fase==="ataque" && c.t!=="e"){ toast("En tu turno se lanzan espantos: las cartas rojas."); return false; }
  if(S.fase==="defensa" && c.t!=="r"){ toast("Para defenderte usá un remedio: las cartas claras."); return false; }
  return true;
}
async function jugarDesde(uid, from, rot0){
  ocupado=true;
  const c=S.players[viewer()].mano.find(x=>x.uid===uid);
  const ataque=S.fase==="ataque";
  const to=$(ataque?"#slotE":"#slotR").getBoundingClientRect();
  const g=await volar(cartaHTML(c), from, to, {rot0, rot1:ataque?-5:7});
  ocupado=false;
  ataque ? lanzar(uid) : resolver(uid);
  soltarVuelo(g);
}
function jugarEl(uid){
  const el=document.querySelector(`#abanico .carta[data-uid="${uid}"]`);
  if(!el || !miAccion() || !validar(uid)) return;
  const r=rectCentro(el), rot=parseFloat(el.style.getPropertyValue("--r"))||0;
  el.style.visibility="hidden";
  jugarDesde(uid, r, rot);
}
function tocar(uid){
  if(S.telon) return;
  if(S.sel===uid){
    if(miAccion()) jugarEl(uid);
    else { S.sel=null; render(); }
  } else { S.sel=uid; Sonido.play("tick"); render(); }
}
async function accionCambiar(){
  if(S.tuto){ toast("En el tutorial no hace falta cambiar cartas."); return; }
  if(!miAccion() || S.fase!=="ataque" || S.sel==null) return;
  const uid=S.sel, el=document.querySelector(`#abanico .carta[data-uid="${uid}"]`); if(!el) return;
  ocupado=true;
  const r=rectCentro(el), rot=parseFloat(el.style.getPropertyValue("--r"))||0;
  el.style.visibility="hidden";
  const c=S.players[viewer()].mano.find(x=>x.uid===uid);
  const g=await volar(cartaHTML(c), r, $("#mazo .pila").getBoundingClientRect(), {rot0:rot,dur:420});
  ocupado=false; cambiar(uid); soltarVuelo(g);
}

/* ---------- Don Ceferino ---------- */
function programarBot(){
  if(!S || S.vista!=="juego" || S.modo!=="bot" || botCorriendo) return;
  if(S.fase==="ataque" && S.turno===1) botAtaque();
  else if(S.fase==="defensa" && S.turno===0) botDefensa();
}
function rivalOrigen(){
  const m=$("#rivalMano"), d=m && m.lastElementChild;
  if(d){ const r=d.getBoundingClientRect(); d.style.visibility="hidden"; return r; }
  return $("#rival").getBoundingClientRect();
}
async function botAtaque(){
  botCorriendo=true; const tok=S;
  const vivo=()=>S===tok && S.vista==="juego" && S.fase==="ataque" && S.turno===1;
  await sleep(900); if(!vivo()){ botCorriendo=false; return; }
  const p=S.players[1], esp=p.mano.filter(c=>c.t==="e");
  if(!esp.length){
    S.burbuja={t:"No tengo con qué asustarte.",x:"Cambio una carta y paso."}; render();
    await sleep(1400); if(!vivo()){ botCorriendo=false; return; }
    const pool=p.mano.filter(c=>c.id!=="rosario"), lista=pool.length?pool:p.mano;
    const c=lista[Math.floor(Math.random()*lista.length)];
    const g=await volar(DORSO, rivalOrigen(), $("#mazo .pila").getBoundingClientRect(), {dur:420});
    botCorriendo=false; cambiar(c.uid); soltarVuelo(g); return;
  }
  esp.sort((a,b)=>ESPANTOS[b.id].poder-ESPANTOS[a.id].poder);
  let c=Math.random()<.6 ? esp[0] : esp[Math.floor(Math.random()*esp.length)];
  if(S.tuto){ const g=esp.find(x=>x.id===TUTO_ATAQUES[S.tuto.a]); S.tuto.a++; if(g) c=g; }
  S.burbuja={t:"Escuchá esta…"}; render();
  await sleep(750); if(!vivo()){ botCorriendo=false; return; }
  const g=await volar(cartaHTML(c), rivalOrigen(), $("#slotE").getBoundingClientRect(), {flip:true,rot1:-5,dur:640});
  botCorriendo=false; lanzar(c.uid); soltarVuelo(g);
}
async function botDefensa(){
  botCorriendo=true; const tok=S;
  const vivo=()=>S===tok && S.vista==="juego" && S.fase==="defensa" && S.turno===0;
  await sleep(1400); if(!vivo()){ botCorriendo=false; return; }
  const p=S.players[1], e=ESPANTOS[S.ataque.id], rems=p.mano.filter(c=>c.t==="r");
  const ok=rems.find(c=>c.id===e.remedio), ros=rems.find(c=>c.id==="rosario");
  let pick=null;
  if(S.tuto){
    const id=TUTO_DEF[S.tuto.d++]; pick=id ? rems.find(c=>c.id===id)||null : null;
    if(pick){ const g=await volar(cartaHTML(pick), rivalOrigen(), $("#slotR").getBoundingClientRect(), {flip:true,rot1:7,dur:640}); botCorriendo=false; resolver(pick.uid); soltarVuelo(g); }
    else { botCorriendo=false; resolver(null); }
    return;
  }
  if(ok && Math.random()<BOT_ACIERTO) pick=ok;
  else if(ros && e.poder>=3) pick=ros;
  else if(Math.random()<.35){ const malos=rems.filter(c=>c.id!==e.remedio && c.id!=="rosario"); if(malos.length) pick=malos[Math.floor(Math.random()*malos.length)]; }
  if(pick){
    const g=await volar(cartaHTML(pick), rivalOrigen(), $("#slotR").getBoundingClientRect(), {flip:true,rot1:7,dur:640});
    botCorriendo=false; resolver(pick.uid); soltarVuelo(g);
  } else { botCorriendo=false; resolver(null); }
}

  </div>`;
}

function acomodarAbanico(){
  const ab=$("#abanico"); if(!ab) return;
  const cs=[...ab.children], n=cs.length; if(!n) return;
  const W=ab.clientWidth, cw=cs[0].offsetWidth;
  const step=n>1 ? Math.min(cw*.62,(W-cw*1.3)/(n-1)) : 0;
  const rmax=n>1 ? Math.min(6,32/(n-1)) : 0;
  cs.forEach((c,i)=>{
    const off=i-(n-1)/2;
    c.style.setProperty("--x",(off*step).toFixed(1));
    c.style.setProperty("--r",(off*rmax).toFixed(2));
    c.style.setProperty("--y",(off*off*2.4).toFixed(1));
    c.style.zIndex=c.classList.contains("sel")?60:i+1;
  });
  ab.dataset.step=step;
}
function render(){
  document.documentElement.classList.toggle("en-juego", S.vista==="juego");
  if(S.vista==="juego") Sonido.ambienteOn(); else Sonido.ambienteOff();
  const app=$("#app");
  if(S.vista==="juego"){ app.innerHTML=juegoHTML(); acomodarAbanico(); if(!S.telon) S.nuevas=[]; }
  else {
    app.innerHTML = S.vista==="reglas" ? reglasHTML() : S.vista==="bestiario" ? bestiarioHTML() : portadaHTML();
    window.scrollTo(0,0);
  }
  coach();
}
function toast(msg){
  const t=$("#toast"); if(!t) return;
  t.textContent=msg; t.hidden=false; clearTimeout(toastT);
  toastT=setTimeout(()=>{ const x=$("#toast"); if(x) x.hidden=true; },2400);
}

/* ---------- arrastre ---------- */
document.addEventListener("pointerdown",e=>{
  const c=e.target.closest("#abanico .carta"); if(!c || ocupado || S.telon || e.button>0) return;
  drag={c,uid:+c.dataset.uid,x0:e.clientX,y0:e.clientY,mov:false,g:null};
  try{ c.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
  if(!drag.mov){
    if(Math.hypot(dx,dy)<9) return;
    drag.mov=true;
    drag.r=rectCentro(drag.c); drag.rot=parseFloat(drag.c.style.getPropertyValue("--r"))||0;
    const g=drag.c.cloneNode(true); g.classList.remove("sel","entra","apagada"); g.classList.add("fantasma");
    Object.assign(g.style,{left:drag.r.left+"px",top:drag.r.top+"px",width:drag.r.width+"px",height:drag.r.height+"px",zIndex:100});
    document.body.appendChild(g); drag.g=g; drag.c.style.visibility="hidden";
  }
  drag.g.style.transform=`translate(${dx}px,${dy}px) rotate(${drag.rot+dx*.04}deg) scale(1.05)`;
  const mz=$(".mano-zona"); if(mz) $(".mesa")?.classList.toggle("apunta", e.clientY<mz.getBoundingClientRect().top && miAccion());
});
document.addEventListener("pointerup",e=>soltar(e,false));
document.addEventListener("pointercancel",e=>soltar(e,true));
function soltar(e,cancel){
  if(!drag) return;
  const d=drag; drag=null; $(".mesa")?.classList.remove("apunta");
  if(!d.mov){ if(!cancel) tocar(d.uid); return; }
  const dx=e.clientX-d.x0, dy=e.clientY-d.y0, rot=d.rot+dx*.04;
  const mz=$(".mano-zona");
  const arriba=!cancel && mz && e.clientY<mz.getBoundingClientRect().top;
  if(arriba){
    if(!miAccion()) toast(S.fase==="resultado"||S.fase==="fin" ? "Primero cerrá el resultado." : "Ahora no es tu jugada.");
    else if(validar(d.uid)){
      const from={left:d.r.left+dx,top:d.r.top+dy,width:d.r.width,height:d.r.height};
      d.g.remove(); jugarDesde(d.uid, from, rot); return;
    }
    d.g.animate([{transform:d.g.style.transform},{transform:`translate(0px,0px) rotate(${d.rot}deg) scale(1)`}],{duration:reduce?1:260,easing:"ease-out",fill:"forwards"})
      .finished.then(()=>{ d.g.remove(); d.c.style.visibility=""; });
    return;
  }
  const v=viewer(), mano=S.players[v].mano, i=mano.findIndex(c=>c.uid===d.uid);
  const ab=$("#abanico"); const step=+(ab&&ab.dataset.step)||1;
  const b=ab.getBoundingClientRect(), cx=b.left+b.width/2;
  let j=Math.round((e.clientX-cx)/step+(mano.length-1)/2); j=Math.max(0,Math.min(mano.length-1,j));
  if(i>=0 && j!==i){ const [c]=mano.splice(i,1); mano.splice(j,0,c); }
  d.g.remove(); render();
}

/* ---------- botones ---------- */
document.addEventListener("click",e=>{
  const c=e.target.closest("#abanico .carta");
  if(c){ if(e.detail===0) tocar(+c.dataset.uid); return; }
  const b=e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const a=b.dataset.act;
  const nombres=()=>[(($("#j1")||{}).value||"").trim()||"Vos",(($("#j2")||{}).value||"").trim()||"Jugador 2"];
  if(a==="iniciar-bot"){ const [n1]=nombres(); iniciar("bot",n1,BOT); }
  else if(a==="iniciar-dos"){ const [n1,n2]=nombres(); iniciar("dos",n1,n2); }
  else if(a==="seguir-partida"){ S.vista="juego"; render(); programarBot(); }
  else if(a==="ver"){ S.volver=S.vista; S.vista=b.dataset.v; render(); }
  else if(a==="volver"){ S.vista=S.volver||"portada"; render(); programarBot(); }
  else if(a==="menu"){ S.vista="portada"; render(); }
  else if(a==="instalar") instalar();
  else if(a==="sonido"){ Sonido.iniciar(); Sonido.setOn(!PREF.sonido); if(PREF.sonido && S.vista==="juego") Sonido.ambienteOn(); render(); }
  else if(a==="sustos"){ PREF.sustos=!PREF.sustos; guardarPref(); render(); }
  else if(a==="telon") levantarTelon();
  else if(a==="jugar"){ if(S.sel!=null) jugarEl(S.sel); }
  else if(a==="cambiar") accionCambiar();
  else if(a==="aguantar"){ if(S.tuto && PASOS[S.tuto.i]?.solo){ toast(`Esta vez usá ${REMEDIOS[PASOS[S.tuto.i].solo].nombre}.`); return; } if(miAccion() && S.fase==="defensa") resolver(null); }
  else if(a==="tuto"){ const [n1]=nombres(); iniciarTuto(n1); }
  else if(a==="coach"){ avanzarCoach(); }
  else if(a==="coach-salir"){ terminarTuto(false); }
  else if(a==="seguir"){ if(!ocupado) seguir(); }
  else if(a==="revancha"){ iniciar(S.modo,S.players[0].nombre,S.players[1].nombre); }
});
addEventListener("resize",()=>{ acomodarAbanico(); posicionarCoach(); });

/* ---------- tutorial: Don Ceferino te enseña ---------- */
const TUTO_MANO_J=["futre","viuda","punal","rosario","tabaco"], TUTO_MANO_B=["familiar","lobizon","fuego","calafate","mulanima"];
const TUTO_ATAQUES=["familiar","lobizon"], TUTO_DEF=["fuego",null];
const selId=()=>{ const c=S.sel!=null && S.players[0].mano.find(x=>x.uid===S.sel); return c?c.id:null; };
const enRes=()=>S.fase==="resultado" && !S.sustoPend;
const PASOS=[
  {txt:"¡Buenas noches! ¿Primera vez en esta mesa? Sentate, que te enseño a jugar. Es un ratito.", btn:"Dale"},
  {t:[".top .marca:not(.der)"], txt:"Esas velitas son tu coraje. Cada susto te apaga algunas. Si se te apagan todas, perdiste la noche. Las mías están a la derecha.", btn:"Entendido"},
  {t:['#abanico'], txt:"Esta es tu mano. Las cartas rojas son espantos y las claras, remedios. Tocá El Futre para leer su leyenda.", hasta:()=>selId()==="futre"||!!S.ataque},
  {t:[".mesa .info"], txt:"Cada carta trae su leyenda y de qué provincia es. El número rojo es el susto: cuántas velas apaga si no lo frenan.", btn:"Sigamos"},
  {t:['#abanico .carta[data-id="futre"]','#slotE'], txt:"Ahora tirámelo: arrastralo hacia la mesa o tocalo otra vez.", hasta:()=>!!S.ataque, solo:"futre"},
  {espera:enRes, t:[".hoja"], arriba:true, txt:"¡Me agarraste! Al Futre se lo calma con un rezo, y yo tiré fuego. Pierdo 2 velas. Abajo siempre te explico qué lo frenaba. Tocá Seguir.", hasta:()=>!S.res},
  {espera:()=>S.fase==="defensa"&&S.turno===1, t:["#slotE",'#abanico .carta[data-id="punal"]'], txt:"Ahora defendete. Te tiré El Familiar, el perro del diablo de los ingenios: solo retrocede ante la cruz que forma el cabo de un puñal. Tirá el Puñal a la mesa.", hasta:()=>!!S.defensa||!!S.res, solo:"punal"},
  {espera:enRes, t:[".hoja"], arriba:true, txt:"¡Eso! Lo espantaste: no perdiste ninguna vela y te ganaste una carta de premio. Tocá Seguir.", hasta:()=>!S.res},
  {espera:()=>S.fase==="ataque"&&S.turno===0&&!S.ataque, t:['#abanico .carta[data-id="viuda"]','#slotE'], txt:"Te toca lanzar a vos. Tirale La Viuda a este viejo.", hasta:()=>!!S.ataque, solo:"viuda"},
  {espera:enRes, t:[".hoja"], arriba:true, txt:"No tenía con qué frenarla, así que me aguanté el susto. Vos también podés aguantar cuando no tenés el remedio. Tocá Seguir.", hasta:()=>!S.res},
  {espera:()=>S.fase==="defensa"&&S.turno===1, t:["#slotE",'#abanico .carta[data-id="rosario"]'], txt:"Al Lobizón lo frena una bala bendecida, y no tenés. Pero el Rosario sirve contra cualquier espanto: te cubre la mitad del susto. Tiralo.", hasta:()=>!!S.defensa||!!S.res, solo:"rosario"},
  {espera:enRes, t:[".hoja"], arriba:true, txt:()=>PREF.sustos?"¡Te asusté! Cuando te pega un espanto de 3 o más, viene un susto fuerte. Con el rosario perdiste 2 velas en vez de 4. Si los sustos no te gustan, se apagan en la portada.":"Con el rosario perdiste 2 velas en vez de 4.", btn:"Entendido"},
  {txt:"Ya sabés todo lo que hace falta. Ahora jugamos en serio, y no te voy a tener piedad.", btn:"Jugar en serio", fin:true}
];
let coachT=null;
function iniciarTuto(n1){
  S=nuevoEstado(n1,BOT,"bot"); S.mazo=armarMazo();
  const tomar=(p,id)=>{ const i=S.mazo.findIndex(c=>c.id===id); const [c]=S.mazo.splice(i,1); S.players[p].mano.push(c); S.nuevas.push(c.uid); };
  TUTO_MANO_J.forEach(id=>tomar(0,id)); TUTO_MANO_B.forEach(id=>tomar(1,id));
  S.tuto={i:0,a:0,d:0,visto:-1}; S.vista="juego"; S.enJuego=true; S.turno=0;
  comenzarTurno();
}
function terminarTuto(jugar=true){
  PREF.tutoHecho=true; guardarPref();
  const el=$("#coach"); if(el) el.hidden=true;
  const n=S.players[0].nombre;
  if(jugar) iniciar("bot",n,BOT); else { S.tuto=null; S.vista="portada"; S.enJuego=false; render(); }
}
function avanzarCoach(){
  const p=S && S.tuto && PASOS[S.tuto.i]; if(!p) return;
  if(p.fin){ terminarTuto(true); return; }
  S.tuto.i++; coach();
}
function coach(){
  let el=$("#coach");
  const activo=S && S.tuto && S.vista==="juego" && !S.telon;
  if(!activo){ if(el) el.hidden=true; return; }
  let p;
  for(;;){
    p=PASOS[S.tuto.i]; if(!p) break;
    if(S.tuto.visto===S.tuto.i && p.hasta && p.hasta()){ S.tuto.i++; continue; }
    break;
  }
  if(!p || S.sustoPend || document.querySelector(".susto") || (p.espera && !p.espera())){ if(el) el.hidden=true; return; }
  S.tuto.visto=S.tuto.i;
  if(!el){
    el=document.createElement("div"); el.id="coach";
    el.innerHTML=`<div class="coach-hueco"></div><div class="coach-globo" role="dialog" aria-label="Tutorial"><div class="coach-quien"><span class="avatar" aria-hidden="true">C</span>${esc(BOT)}<span class="coach-paso"></span></div><p class="coach-txt" aria-live="polite"></p><div class="coach-pie"><button class="vinc" data-act="coach-salir">Saltear</button><button class="btn prim coach-btn" data-act="coach"></button></div></div>`;
    document.body.appendChild(el);
  }
  el.hidden=false;
  el.querySelector(".coach-txt").textContent=typeof p.txt==="function"?p.txt():p.txt;
  el.querySelector(".coach-paso").textContent=`${S.tuto.i+1} de ${PASOS.length}`;
  const b=el.querySelector(".coach-btn"); b.hidden=!p.btn; b.textContent=p.btn||"";
  el.querySelector('[data-act="coach-salir"]').hidden=!!p.fin;
  posicionarCoach();
  clearTimeout(coachT); coachT=setTimeout(posicionarCoach,1150);
}
function posicionarCoach(){
  const el=$("#coach"); if(!el || el.hidden || !S || !S.tuto) return;
  const p=PASOS[S.tuto.i]; if(!p) return;
  const h=el.querySelector(".coach-hueco"), g=el.querySelector(".coach-globo");
  const rs=(p.t||[]).map(q=>document.querySelector(q)).filter(Boolean).map(x=>x.getBoundingClientRect()).filter(r=>r.width>0);
  let r=null;
  if(rs.length){ const L=Math.min(...rs.map(x=>x.left)), T=Math.min(...rs.map(x=>x.top)), R=Math.max(...rs.map(x=>x.right)), B=Math.max(...rs.map(x=>x.bottom)); r={left:L,top:T,right:R,bottom:B,width:R-L,height:B-T}; }
  const pad=8;
  if(r){ Object.assign(h.style,{left:r.left-pad+"px",top:r.top-pad+"px",width:r.width+pad*2+"px",height:r.height+pad*2+"px"}); h.classList.add("foco"); }
  else { Object.assign(h.style,{left:innerWidth/2+"px",top:innerHeight/2+"px",width:"0px",height:"0px"}); h.classList.remove("foco"); }
  const gh=g.offsetHeight, H=innerHeight; let top;
  if(!r) top=(H-gh)/2;
  else if(p.arriba) top=12;
  else if(r.top+r.height/2>H/2) top=r.top-pad-14-gh;
  else top=r.bottom+pad+14;
  g.style.top=Math.max(12,Math.min(H-gh-12,top))+"px";
}

/* ---------- inicio e instalación ---------- */
(function(){

  el.addEventListener("click",()=>{ el.classList.add("salir"); setTimeout(quitar,380); });

  setTimeout(quitar,4600);
})();
const enFrame=(()=>{ try{ return window.top!==window; }catch(_){ return true; } })();
const standalone=matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const esIOS=/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
let pedidoInstalar=null, ayudaIOS=false;
addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); pedidoInstalar=e; if(S && S.vista==="portada") render(); });
addEventListener("appinstalled",()=>{ pedidoInstalar=null; if(S && S.vista==="portada") render(); });
if(!enFrame && "serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
function instalarHTML(){
  if(enFrame || standalone) return "";
  if(pedidoInstalar) return `<div class="instalar"><img src="icons/icon-192.png" alt=""><div><b>Instalalo en el celu</b><span class="sub">Se abre como app y anda sin internet contra ${BOT}.</span></div><button class="btn prim" data-act="instalar">Instalar</button></div>`;
  if(esIOS) return `<div class="instalar"><img src="icons/icon-192.png" alt=""><div><b>Instalalo en el iPhone</b><span class="sub">${ayudaIOS?"En Safari tocá el botón Compartir (el cuadrado con la flecha) y elegí «Agregar a inicio».":"Agregalo a tu pantalla de inicio para abrirlo como app."}</span></div>${ayudaIOS?"":`<button class="btn prim" data-act="instalar">Cómo</button>`}</div>`;
  return "";
}
async function instalar(){
  if(pedidoInstalar){ const p=pedidoInstalar; pedidoInstalar=null; p.prompt(); try{ await p.userChoice; }catch(_){} render(); }
  else if(esIOS){ ayudaIOS=true; render(); }
}

function start(data){
  S = data && data.S && "enJuego" in data.S ? data.S : nuevoEstado("Vos",BOT,"bot");
  if(data && data.uidSeq) uidSeq=data.uidSeq;
  S.nuevas=S.nuevas||[]; S.sustoPend=false; ocupado=false; botCorriendo=false;
  window.claude?.hot?.snapshot?.(()=>({S,uidSeq}));
  render(); programarBot();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
